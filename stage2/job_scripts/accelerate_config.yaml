compute_environment: LOCAL_MACHINE
debug: false
distributed_type: MULTI_GPU
downcast_bf16: 'no'
# gpu_ids: all  — let SLURM control which GPUs are visible via CUDA_VISIBLE_DEVICES.
# On Snellius SLURM assigns GPUs by physical PCIe bus ID, not logical 0,1, so 'all'
# is correct and --num_processes (set on the launch line) controls the count.
gpu_ids: all
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 1
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
